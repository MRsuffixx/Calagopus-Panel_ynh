#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__;

    # Standard proxy headers — required so APP_TRUSTED_PROXIES=127.0.0.1 works
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade headers — REQUIRED for live console output and stats
    # streaming. Without these, server console windows in the panel will fail
    # silently or show a blank output even though the server is running.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Increase timeouts for long-running WebSocket connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Buffer settings — disable buffering for streaming responses
    proxy_buffering off;

    # Allow large file uploads (e.g. server JARs, world backups via the panel)
    client_max_body_size 512M;

    # Include standard YunoHost NGINX includes
    include conf.d/yunohost_panel.conf.inc;
    include conf.d/yunohost_admin.conf.inc;
}
