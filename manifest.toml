#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "calagopus-panel"
name = "Calagopus Panel"
description.en = "Game server management panel built in Rust — deploy and manage Minecraft, Rust, and more"

version = "1.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
# ASSUMPTION: License is MIT per the prompt spec. Verify at:
# https://github.com/calagopus/panel/blob/main/LICENSE (or calagopus/calagopus repo)
website = "https://calagopus.com"
admindoc = "https://calagopus.com/docs/panel/"
userdoc = "https://calagopus.com/docs/panel/"
code = "https://github.com/calagopus/panel"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"

# ARCHITECTURE NOTE:
# The Calagopus APT repository ships amd64 binaries. ARM64 and other
# architectures are NOT claimed here because:
#   1. The APT repo URL (https://packages.calagopus.com/deb stable main) was
#      not crawled during packaging — supported arches are unverified.
#   2. Many Rust game panels only publish amd64 builds.
# If the upstream repo confirms arm64 support, add "arm64" to this list.
# Reference: https://calagopus.com/docs/panel/installation/pkgmanager
architectures = ["amd64"]

# MULTI-INSTANCE:
# Multi-instance is supported because:
#   - Each instance gets its own system user, install_dir, PostgreSQL DB,
#     Redis database index, and allocated port.
#   - The .env is per-instance and includes its own APP_ENCRYPTION_KEY.
# Set to false if you determine that the panel binary does not support
# running multiple instances on the same host.
multi_instance = true

# SSO/LDAP: Calagopus manages its own authentication entirely.
# YunoHost accounts are NOT linked to Calagopus accounts.
# This is an explicit, intentional design decision — see README.md.
ldap = false
sso = false

# Resource estimates:
# PostgreSQL: ~150MB initial, grows with server data
# Panel binary (Rust/axum): ~256MB RAM at idle
disk = "500M"
ram.build = "50M"
ram.runtime = "256M"

[install]
    [install.domain]
    # Generic question — ask strings handled by YunoHost core
    type = "domain"

    [install.path]
    # The Calagopus Panel SPA may not support sub-path installation.
    # ASSUMPTION: Sub-path support is unverified against the built binary.
    # If testing shows sub-paths are broken (missing assets, blank page),
    # remove this question and hard-code the default to "/" in the manifest.
    # See §3.5 of the packaging spec and README.md for details.
    type = "path"
    default = "/"

    [install.init_main_permission]
    # Controls who can access the panel URL via SSOwat.
    # Calagopus has its own auth, so this is purely a reverse-proxy gate.
    # Default "visitors" allows public access (the OOBE wizard is accessible).
    # The admin can change this to "all_users" to require YunoHost login as
    # a second layer, though that is not required for the app to function.
    type = "group"
    default = "visitors"

[resources]
    [resources.system_user]
    # Provisions a dedicated $app system user (no login shell, no home dir)
    # The systemd service runs as this user for isolation.

    [resources.install_dir]
    # Creates /var/www/$app and stores the path as $install_dir
    # The .env file with APP_ENCRYPTION_KEY lives here.

    [resources.ports]
    # Allocates a random free port and stores it as $port
    # The panel's HTTP listener is bound to 127.0.0.1:$port

    [resources.apt]
    # Declare curl and gpg as system dependencies needed for repo key import.
    # calagopus-panel itself is installed manually after the repo is added.
    # (We cannot use the apt resource for calagopus-panel directly because the
    # repo must be registered first, which happens in the install script.)
    packages = ["curl", "gpg"]

    [resources.database]
    # Auto-provisions a PostgreSQL role and database.
    # Stores credentials as $db_user, $db_name, $db_pwd.
    # Handles dump/restore on backup/restore and cleanup on remove for free.
    type = "postgresql"

    [resources.permissions]
    # Main permission: the app URL is accessible to the chosen group.
    # No SSO or LDAP auth callback is wired — this is purely a reverse proxy
    # gate (or left open for public access). Calagopus handles its own auth.
    main.url = "/"
    # auth_header = false ensures YunoHost does NOT inject SSO auth headers,
    # which would interfere with Calagopus's own authentication flow.
    main.auth_header = false
