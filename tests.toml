test_format = "1.0"

[default]
    # This test configuration runs the standard YunoHost CI suite against
    # a Calagopus Panel install, testing all lifecycle operations.

    [default.test_install]
    # Standard install with default settings
    args = "domain=calagopus.example.com&path=/&init_main_permission=visitors"

    [default.test_upgrade]
    # Upgrade from the same version (idempotency test)
    # Running twice must yield the same end-state
    args = "domain=calagopus.example.com&path=/&init_main_permission=visitors"
    args_after_install = ""
    test_upgrade_from.main.url = "https://github.com/your-fork/calagopus-panel_ynh"

    [default.test_backup_restore]
    # Full backup + restore cycle
    args = "domain=calagopus.example.com&path=/&init_main_permission=visitors"

    [default.test_change_url]
    # URL change: move from root / to /panel (may reveal sub-path SPA issues)
    args_after_install = "domain=calagopus.example.com&path=/panel"

[multi_instance]
    # Test two instances on the same domain/server to verify multi-instance safety
    [multi_instance.test_install]
    args = "domain=calagopus.example.com&path=/&init_main_permission=visitors"

    [multi_instance.test_install_2]
    args = "domain=calagopus2.example.com&path=/&init_main_permission=visitors"
